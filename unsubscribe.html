<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Annulla iscrizione | Archyva</title>
  <meta name="color-scheme" content="light" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: #f8fafc;
      color: #232c4b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 520px;
      background: #fff;
      border: 1px solid #e8ecf2;
      border-radius: 20px;
      box-shadow: 0 2px 16px rgba(35,44,75,0.08);
      overflow: hidden;
    }
    .header {
      background: #232c4b;
      color: #fff;
      padding: 24px 28px;
      font-size: 22px;
      font-weight: 700;
    }
    .accent {
      height: 4px;
      background: #7b5cff;
    }
    .content {
      padding: 32px 28px;
      line-height: 1.6;
    }
    .status {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .muted {
      color: #6b7280;
      font-size: 15px;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #dbe3ef;
      border-top-color: #232c4b;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    .ok { color: #232c4b; }
    .err { color: #ef4444; }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    a {
      color: #7b5cff;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">Archyva</div>
    <div class="accent"></div>
    <div class="content" id="app">
      <div class="spinner"></div>
      <div class="status">Sto elaborando la richiesta...</div>
      <div class="muted">Attendi qualche secondo.</div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://slxpygkptdrcgnssulqe.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNseHB5Z2twdGRyY2duc3N1bHFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI4NDg4MDgsImV4cCI6MjA3ODQyNDgwOH0.ToS3ltSsvuP5U0jPHIZ-l-qiEkQY45naJzjiK2OPf_E";

    const app = document.getElementById("app");
    const params = new URLSearchParams(window.location.search);
    const uid = params.get("uid");

    function render(title, message, isError = false) {
      app.innerHTML = `
        <div class="status ${isError ? "err" : "ok"}">${title}</div>
        <div class="muted">${message}</div>
      `;
    }

    async function run() {
      if (!uid) {
        render("Link non valido", "Il parametro uid non è presente.", true);
        return;
      }

      try {
        const url = `${SUPABASE_URL}/functions/v1/unsubscribe?uid=${encodeURIComponent(uid)}&apikey=${encodeURIComponent(SUPABASE_ANON_KEY)}`;
        const res = await fetch(url, {
          method: "GET",
          headers: {
            apikey: SUPABASE_ANON_KEY
          }
        });

        if (!res.ok) {
          render("Errore", "Non sono riuscito a completare la disiscrizione. Riprova più tardi.", true);
          return;
        }

        render(
          "Disiscrizione completata",
          "Non riceverai più email di comunicazione da Archyva. Puoi continuare a usare l'app normalmente."
        );
      } catch (err) {
        render("Errore di rete", "Controlla la connessione e riprova.", true);
      }
    }

    run();
  </script>
</body>
</html>
